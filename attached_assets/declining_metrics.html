<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métricas Descendentes - Sin Altevia</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dashboard {
            max-width: 800px;
            width: 100%;
        }
        .title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
            color: #ef4444;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .metric-value {
            font-size: 48px;
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 8px;
        }
        .metric-label {
            font-size: 16px;
            color: #d1d5db;
            margin-bottom: 16px;
        }
        .trend {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ef4444;
            font-weight: 600;
        }
        .trend-icon {
            font-size: 20px;
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chart {
            height: 200px;
            background: linear-gradient(to bottom, 
                rgba(239, 68, 68, 0.2) 0%,
                rgba(239, 68, 68, 0.1) 50%,
                rgba(239, 68, 68, 0) 100%);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        .chart-line {
            position: absolute;
            bottom: 80%;
            left: 10%;
            width: 80%;
            height: 4px;
            background: #ef4444;
            transform: rotate(-20deg);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        .chart-line::after {
            content: '📉';
            position: absolute;
            right: -20px;
            top: -15px;
            font-size: 24px;
        }
        .warning-text {
            text-align: center;
            font-size: 18px;
            color: #fbbf24;
            margin-top: 30px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1 class="title">❌ Sin SEO, Sin Presencia, Sin Clientes</h1>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-value">2%</div>
                <div class="metric-label">Visibilidad Online</div>
                <div class="trend">
                    <span class="trend-icon">📉</span>
                    <span>-15% este mes</span>
                </div>
            </div>
            
            <div class="metric-card">
                <div class="metric-value">89</div>
                <div class="metric-label">Visitas Web</div>
                <div class="trend">
                    <span class="trend-icon">📉</span>
                    <span>-32% este mes</span>
                </div>
            </div>
            
            <div class="metric-card">
                <div class="metric-value">1.2★</div>
                <div class="metric-label">Rating Promedio</div>
                <div class="trend">
                    <span class="trend-icon">📉</span>
                    <span>Sin gestión de reseñas</span>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <h3 style="margin-top: 0; color: #ef4444;">Tendencia de Tráfico Web</h3>
            <div class="chart">
                <div class="chart-line"></div>
            </div>
        </div>

        <div class="warning-text">
            ⚠️ Cada día que pasa, pierdes clientes ante la competencia
        </div>
    </div>
</body>
</html>
